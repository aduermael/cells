    Outer square (main bounds): (8,8)–(88,88) size 80
    Well (BR pocket, flush to outer): (68,68)–(88,88) size 20
    Handle 12×12 inset by gap 4 on all sides of well: (72,72)–(84,84)
    Handle center (78,78) sits on the diagonal of the BR border zone
      (between body corner 68,68 and outer corner 88,88 — “on the border”, not outside)
    Chevron: prompt > centered in body
  -->
  <path
    fill="#0A0A0A"
    fill-rule="evenodd"
    d="M8 8H88V88H8ZM28 24L52 40L28 56V48L40 40L28 32ZM68 68H88V88H68Z"
  />
  <rect x="72" y="72" width="12" height="12" fill="#0A0A0A"/>
