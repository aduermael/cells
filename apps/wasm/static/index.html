            let selX = HEADER_WIDTH;
            for (let i = 0; i < newCol; i++) {
                selX += colWidths.get(i) || DEFAULT_COL_WIDTH;
            }
            let selY = HEADER_HEIGHT;
            for (let i = 0; i < newRow; i++) {
                selY += rowHeights.get(i) || DEFAULT_ROW_HEIGHT;
            }
            const selW = colWidths.get(newCol) || DEFAULT_COL_WIDTH;
            const selH = rowHeights.get(newRow) || DEFAULT_ROW_HEIGHT;

            const viewWidth = canvas.clientWidth;
            const viewHeight = canvas.clientHeight;

            if (selX - scrollX < HEADER_WIDTH) {
                scrollX = selX - HEADER_WIDTH;
            } else if (selX + selW - scrollX > viewWidth) {
                scrollX = selX + selW - viewWidth;
            }

            if (selY - scrollY < HEADER_HEIGHT) {
                scrollY = selY - HEADER_HEIGHT;
            } else if (selY + selH - scrollY > viewHeight) {
                scrollY = selY + selH - viewHeight;
            }

            render();
            updateFormulaBar();
            fetchViewportNow();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            fetchViewportNow();
        });

        // ========================================================================
        // Sheet Tabs
        // ========================================================================

        async function fetchSheets() {
            if (!dataSource) return;
            try {
                const result = await dataSource.getSheets();
                sheets = result.sheets;
                activeSheetIndex = result.activeIndex;
                renderSheetTabs();
            } catch (e) {
                console.error('Error fetching sheets:', e);
            }
        }

        function renderSheetTabs() {
            sheetTabsContainer.innerHTML = '';

            sheets.forEach((sheet, idx) => {
                const tab = document.createElement('div');
                tab.className = 'sheet-tab' + (sheet.active ? ' active' : '');
                tab.textContent = sheet.name;
                tab.dataset.index = idx;
                tab.draggable = true;

                // Click to switch sheet
                tab.addEventListener('click', async (e) => {
                    if (isEditingSheetTab) return;
                    e.preventDefault();
                    await switchToSheet(idx);
                });

                // Double-click to rename
                tab.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    startEditingSheetTab(idx);
                });

                // Context menu (right-click)
                tab.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showSheetTabContextMenu(e.clientX, e.clientY, idx);
                });

                // Drag start
                tab.addEventListener('dragstart', (e) => {
                    isDraggingSheetTab = true;
                    dragSheetIndex = idx;
                    tab.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', idx.toString());
                });

                // Drag end
                tab.addEventListener('dragend', () => {
                    isDraggingSheetTab = false;
                    dragSheetIndex = -1;
                    tab.classList.remove('dragging');
                    // Remove any drop indicators
                    sheetTabsContainer.querySelectorAll('.sheet-tab').forEach(t => {
                        t.style.marginLeft = '';
                        t.style.marginRight = '';
                    });
                });

                // Drag over
                tab.addEventListener('dragover', (e) => {
                    if (!isDraggingSheetTab || dragSheetIndex === idx) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';

                    const rect = tab.getBoundingClientRect();
                    const midX = rect.left + rect.width / 2;
                    const insertBefore = e.clientX < midX;

                    // Reset all margins
                    sheetTabsContainer.querySelectorAll('.sheet-tab').forEach(t => {
                        t.style.marginLeft = '';
                        t.style.marginRight = '';
                    });

                    // Show drop indicator
                    if (insertBefore) {
                        tab.style.marginLeft = '20px';
                        dragSheetTargetIndex = idx;
                    } else {
                        tab.style.marginRight = '20px';
                        dragSheetTargetIndex = idx + 1;
                    }
                });

                // Drop
                tab.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    if (!isDraggingSheetTab || dragSheetIndex < 0) return;

                    const fromIdx = dragSheetIndex;
                    const toIdx = dragSheetTargetIndex;

                    if (fromIdx !== toIdx && fromIdx + 1 !== toIdx) {
                        try {
                            const result = await dataSource.moveSheet(fromIdx, toIdx);
                            activeSheetIndex = result.activeIndex;
                            await fetchSheets();
                        } catch (err) {
                            console.error('Error moving sheet:', err);
                        }
                    }

                    isDraggingSheetTab = false;
                    dragSheetIndex = -1;
                    dragSheetTargetIndex = -1;
                });

                sheetTabsContainer.appendChild(tab);
            });
        }

        async function switchToSheet(index) {
            if (!dataSource || index === activeSheetIndex) return;
            try {
                await dataSource.setActiveSheet(index);
                activeSheetIndex = index;

                // Reset view state
                scrollX = 0;
                scrollY = 0;
                setDefaultSelection();  // Reset selection to A1
                isSelectingRange = false;
                colWidths.clear();
                rowHeights.clear();
                colNames.clear();

                // Re-fetch data
                await fetchSheetInfo();
                await fetchViewport();
                await fetchSheets();
                render();
                updateFormulaBar();
            } catch (e) {
                console.error('Error switching sheet:', e);
            }
        }

        function startEditingSheetTab(index) {
            isEditingSheetTab = true;
            editingSheetIndex = index;

            const tab = sheetTabsContainer.children[index];
            if (!tab) return;

            const currentName = sheets[index].name;

            // Create inline editor
            const editor = document.createElement('input');
            editor.type = 'text';
            editor.className = 'sheet-tab-editor';
            editor.value = currentName;

            // Replace tab content with editor
            tab.textContent = '';
            tab.appendChild(editor);
            editor.focus();
            editor.select();

            const finishEditing = async (save) => {
                if (!isEditingSheetTab) return;
                isEditingSheetTab = false;
                editingSheetIndex = -1;

                const newName = editor.value.trim();
                tab.textContent = save && newName ? newName : currentName;

                if (save && newName && newName !== currentName) {
                    try {
                        await dataSource.renameSheet(index, newName);
                        await fetchSheets();
                    } catch (err) {
                        console.error('Error renaming sheet:', err);
                        tab.textContent = currentName;
                    }
                }
            };

            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    finishEditing(true);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    finishEditing(false);
                }
                e.stopPropagation();
            });

            editor.addEventListener('blur', () => {
                finishEditing(true);
            });
        }

        function showSheetTabContextMenu(x, y, sheetIndex) {
            hideSheetTabContextMenu();

            const menu = document.createElement('div');
            menu.className = 'sheet-tab-context-menu';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';

            // Rename option
            const renameBtn = document.createElement('button');
            renameBtn.className = 'sheet-tab-context-menu-item';
            renameBtn.textContent = 'Rename';
            renameBtn.addEventListener('click', () => {
                hideSheetTabContextMenu();
                startEditingSheetTab(sheetIndex);
            });
            menu.appendChild(renameBtn);

            // Delete option
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'sheet-tab-context-menu-item danger';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', async () => {
                hideSheetTabContextMenu();
                await deleteSheetWithConfirm(sheetIndex);
            });
            menu.appendChild(deleteBtn);

            document.body.appendChild(menu);
            sheetTabContextMenu = menu;

            // Close on click outside
            setTimeout(() => {
                document.addEventListener('click', hideSheetTabContextMenu, { once: true });
            }, 0);
        }

        function hideSheetTabContextMenu() {
            if (sheetTabContextMenu) {
                sheetTabContextMenu.remove();
                sheetTabContextMenu = null;
            }
        }

        async function deleteSheetWithConfirm(index) {
            if (!dataSource) return;

            // If this is the last sheet, create a new one first
            if (sheets.length <= 1) {
                try {
                    await dataSource.addSheet('Sheet1');
                    await dataSource.deleteSheet(index);
                    activeSheetIndex = 0;
                    await fetchSheets();
                    await switchToSheet(0);
                } catch (err) {
                    console.error('Error handling last sheet delete:', err);
                }
                return;
            }

            try {
                const result = await dataSource.deleteSheet(index);
                activeSheetIndex = result.activeIndex;
                await fetchSheets();

                // Reset view if we deleted the current sheet
                scrollX = 0;
                scrollY = 0;
                setDefaultSelection();  // Reset selection to A1
                colWidths.clear();
                rowHeights.clear();
                colNames.clear();

                await fetchSheetInfo();
                await fetchViewport();
                render();
                updateFormulaBar();
            } catch (err) {
                console.error('Error deleting sheet:', err);
            }
        }

        // Add sheet button
        addSheetBtn.addEventListener('click', async () => {
            if (!dataSource) return;
            try {
                const result = await dataSource.addSheet();
                await fetchSheets();
                // Switch to the new sheet
                await switchToSheet(result.index);
            } catch (err) {
                console.error('Error adding sheet:', err);
            }
        });

        // ========================================================================
        // File Persistence (IndexedDB)
        // ========================================================================

        const DB_NAME = 'cells-viewer';
        const DB_VERSION = 1;
        const STORE_NAME = 'files';
        const FILE_KEY = 'current';
        const META_KEY = 'cells-viewer-file-meta';

        let db = null;

        async function openDatabase() {
            if (db) return db;

            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

        async function saveFileToIndexedDB(data) {
            const database = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.put(data, FILE_KEY);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve();
            });
        }

        async function loadFileFromIndexedDB() {
            const database = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.get(FILE_KEY);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function clearPersistedFile() {
            const database = await openDatabase();
            return new Promise((resolve, reject) => {
                const tx = database.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.delete(FILE_KEY);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    localStorage.removeItem(META_KEY);
                    resolve();
                };
            });
        }

        function saveFileMeta(name, format) {
            localStorage.setItem(META_KEY, JSON.stringify({ name, format, timestamp: Date.now() }));
        }

        function loadFileMeta() {
            const meta = localStorage.getItem(META_KEY);
            return meta ? JSON.parse(meta) : null;
        }

        // ========================================================================
        // File Loading
        // ========================================================================

        async function ensureWasmClient() {
            if (wasmClient) return wasmClient;

            wasmClient = new CellsClient('./worker.js');
            await wasmClient.ready;
            return wasmClient;
        }

        async function loadFile(file) {
            loading.textContent = '';
            loading.innerHTML = '<span class="spinner"></span>Loading ' + file.name + '...';
            loading.style.display = 'block';
            errorEl.style.display = 'none';
            emptyState.classList.add('hidden');

            try {
                const data = await file.arrayBuffer();
                const format = detectFormat(file.name, data);
                const baseName = getBaseName(file.name);

                await loadFileData(data, format, baseName, file.name);

                // Persist file to IndexedDB for reload on refresh
                try {
                    await saveFileToIndexedDB(data);
                    saveFileMeta(file.name, format);
                } catch (persistErr) {
                    console.warn('Failed to persist file:', persistErr);
                }

                loading.style.display = 'none';

            } catch (e) {
                console.error('Error loading file:', e);
                loading.style.display = 'none';
                errorEl.textContent = 'Failed to load: ' + e.message;
                errorEl.style.display = 'block';
            }
        }

        // Core file loading logic (shared by loadFile and auto-load from persistence)
        async function loadFileData(data, format, baseName, displayName) {
            const client = await ensureWasmClient();

            if (format === 'cells') {
                const text = new TextDecoder().decode(data);
                await client.loadCells(text);
            } else if (format === 'csv') {
                await client.loadCSV(data);
            } else if (format === 'xlsx') {
                await client.loadXLSX(data);
            }

            dataSource = new WasmDataSource(client);
            dataSource.setWorkbookName(baseName);
            hasFileLoaded = true;

            // Reset state
            scrollX = 0;
            scrollY = 0;
            setDefaultSelection();  // Reset selection to A1
            isSelectingRange = false;
            colWidths.clear();
            rowHeights.clear();
            colNames.clear();

            // Enable export button and show New button
            document.getElementById('export-btn').disabled = false;
            document.getElementById('new-btn').style.display = '';

            // Show the canvas, formula bar, and sheet tabs (hide empty state)
            canvas.style.display = 'block';
            formulaBar.classList.remove('hidden');
            sheetTabsEl.classList.remove('hidden');
            emptyState.classList.add('hidden');
            resizeCanvas();

            await fetchSheetInfo();
            await fetchViewport();
            await fetchSheets();
            render();
            updateFormulaBar();
        }

        // Make functions available globally
        window.openFile = function() {
            fileInput.click();
        };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadFile(file);
                fileInput.value = '';
            }
        });

        window.exportAs = async function(format) {
            if (!dataSource) {
                alert('No file loaded');
                return;
            }
            try {
                const result = await dataSource.exportAs(format);
                downloadBlob(result.blob, result.filename);
            } catch (e) {
                console.error('Export error:', e);
                alert('Export failed: ' + e.message);
            }
        };

        window.newFile = async function() {
            // Clear persisted file
            try {
                await clearPersistedFile();
            } catch (e) {
                console.warn('Failed to clear persisted file:', e);
            }

            // Reset state
            sheetInfo = null;
            cells = [];
            columns = [];
            rows = [];
            sheets = [];
            activeSheetIndex = 0;
            errorEl.style.display = 'none';

            // Create fresh empty workbook (keeps UI showing, not empty state)
            await createEmptyWorkbook();
        };

        // ========================================================================
        // Drag and Drop
        // ========================================================================

        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('visible');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('visible');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('visible');

            const file = e.dataTransfer.files[0];
            if (file) {
                loadFile(file);
            }
        });

        // ========================================================================
        // Export Dropdown
        // ========================================================================

        const exportDropdown = document.getElementById('export-dropdown');
        const exportBtn = document.getElementById('export-btn');

        exportBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (exportBtn.disabled) return;
            exportDropdown.classList.toggle('open');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('open');
            }
        });

        // Close dropdown when clicking a menu item
        exportDropdown.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                exportDropdown.classList.remove('open');
            });
        });

        // ========================================================================
        // Initialization
        // ========================================================================

        async function tryAutoLoadPersistedFile() {
            const meta = loadFileMeta();
            if (!meta) return false;

            try {
                const data = await loadFileFromIndexedDB();
                if (!data) return false;

                loading.textContent = '';
                loading.innerHTML = '<span class="spinner"></span>Restoring ' + meta.name + '...';
                loading.style.display = 'block';
                emptyState.classList.add('hidden');

                const baseName = getBaseName(meta.name);
                await loadFileData(data, meta.format, baseName, meta.name);

                loading.style.display = 'none';
                return true;
            } catch (e) {
                console.warn('Failed to auto-load persisted file:', e);
                // Clear corrupted data
                try {
                    await clearPersistedFile();
                } catch (clearErr) {
                    console.warn('Failed to clear corrupted persistence:', clearErr);
                }
                return false;
            }
        }

        // Set default selection to A1 (0,0)
        function setDefaultSelection() {
            selectedCell = { col: 0, row: 0 };
            selectionStart = { col: 0, row: 0 };
            selectionEnd = { col: 0, row: 0 };
            selectedColumn = null;
            selectedRow = null;
        }

        // Create or reset to an empty workbook
        async function createEmptyWorkbook() {
            const client = await ensureWasmClient();
            await client.createEmpty();

            dataSource = new WasmDataSource(client);
            dataSource.setWorkbookName('Untitled');
            hasFileLoaded = true;

            // Reset state
            scrollX = 0;
            scrollY = 0;
            setDefaultSelection();
            isSelectingRange = false;
            colWidths.clear();
            rowHeights.clear();
            colNames.clear();

            // Enable export button and show New button
            document.getElementById('export-btn').disabled = false;
            document.getElementById('new-btn').style.display = '';

            // Show the canvas, formula bar, and sheet tabs (hide empty state)
            canvas.style.display = 'block';
            formulaBar.classList.remove('hidden');
            sheetTabsEl.classList.remove('hidden');
            emptyState.classList.add('hidden');
            resizeCanvas();

            await fetchSheetInfo();
            await fetchViewport();
            await fetchSheets();
            render();
            updateFormulaBar();
        }

        async function init() {
            resizeCanvas();

            // Try to auto-load persisted file
            const loaded = await tryAutoLoadPersistedFile();

            if (!loaded) {
                // Create empty workbook on startup (no "empty state" - always have a sheet)
                await createEmptyWorkbook();
            } else {
                // If file loaded, ensure we have a default selection
                if (!selectedCell) {
                    setDefaultSelection();
                    render();
                    updateFormulaBar();
                }
            }
        }

        init();
    </script>
</body>
