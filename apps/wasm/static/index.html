<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cells - Spreadsheet Viewer</title>
    <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
    <div id="container">
        <div id="header">
            <button class="btn" onclick="openFile()">Open File</button>
            <input type="file" id="file-input" accept=".cells,.csv,.tsv,.xlsx" />
            <h1 id="sheet-name">Cells Viewer</h1>
            <div id="toolbar">
                <div class="dropdown" id="export-dropdown">
                    <button class="dropdown-btn" id="export-btn" disabled>
                        Export <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="exportAs('csv')">CSV</button>
                        <button class="dropdown-item" onclick="exportAs('xlsx')">XLSX</button>
                        <button class="dropdown-item" onclick="exportAs('cells')">CELLS</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="formula-bar" class="hidden">
            <span id="cell-reference">A1</span>
            <input type="text" id="formula-input" placeholder="Select a cell to view or edit its value" />
        </div>
        <div id="canvas-container">
            <canvas id="grid" tabindex="0"></canvas>
            <input type="text" id="cell-editor" />
            <input type="text" id="column-header-editor" />
            <div id="loading"><span class="spinner"></span>Loading...</div>
            <div id="error">Failed to load file</div>
            <div id="drop-zone">
                <div id="drop-zone-content">
                    <h2>Drop file here</h2>
                    <p>.cells, .csv, .xlsx</p>
                </div>
            </div>
            <div id="empty-state">
                <h2>Open a Spreadsheet</h2>
                <p>Drag and drop a file here, or click below to browse</p>
                <button class="btn-primary" onclick="openFile()">Choose File</button>
                <div class="file-types">Supported: .cells, .csv, .tsv, .xlsx</div>
            </div>
        </div>
    </div>

    <!-- Load the client library -->
    <script src="client.js"></script>

    <script type="module">
        import {
            GridRenderer,
            HEADER_HEIGHT,
            HEADER_WIDTH,
            DEFAULT_COL_WIDTH,
            DEFAULT_ROW_HEIGHT,
            COLORS
        } from './shared/grid-renderer.js';

        import { detectFormat, getBaseName, downloadBlob, getMimeType } from './shared/utils.js';

        // ========================================================================
        // WASM Data Source (communicates with Web Worker)
        // ========================================================================

        class WasmDataSource {
            constructor(client) {
                this._client = client;
                this._workbookName = 'Untitled';
            }

            setWorkbookName(name) {
                this._workbookName = name;
            }

            async getSheetInfo() {
                const info = await this._client.getSheetInfo();
                return {
                    name: info.name,
                    rowCount: info.rowCount,
                    colCount: info.colCount
                };
            }

            async getViewport(x1, y1, x2, y2) {
                return this._client.queryViewport(x1, y1, x2, y2);
            }

            async createCell(col, row, value) {
                return this._client.createCell(col, row, value);
            }

            async updateCell(cellId, value) {
                await this._client.updateCell(cellId, value);
                return { success: true };
            }

            async deleteCell(cellId) {
                await this._client.deleteCell(cellId);
                return { success: true };
            }

            async resizeColumn(colId, width) {
                await this._client.resizeColumn(colId, width);
                return { success: true };
            }

            async resizeColumnByPos(pos, width) {
                return this._client.resizeColumnByPos(pos, width);
            }

            async resizeRow(rowId, height) {
                await this._client.resizeRow(rowId, height);
                return { success: true };
            }

            async resizeRowByPos(pos, height) {
                return this._client.resizeRowByPos(pos, height);
            }

            async moveColumn(colId, targetPos) {
                await this._client.moveColumn(colId, targetPos);
                return { success: true };
            }

            async moveRow(rowId, targetPos) {
                await this._client.moveRow(rowId, targetPos);
                return { success: true };
            }

            async shiftColumnsForEmptyMove(sourcePos, targetPos) {
                await this._client.shiftColumnsForEmptyMove(sourcePos, targetPos);
                return { success: true };
            }

            async shiftRowsForEmptyMove(sourcePos, targetPos) {
                await this._client.shiftRowsForEmptyMove(sourcePos, targetPos);
                return { success: true };
            }

            async renameColumn(colId, name) {
                await this._client.renameColumn(colId, name);
                return { success: true };
            }

            async exportAs(format) {
                const result = await this._client.exportAs(format);
                const blob = new Blob([result.data], { type: getMimeType(format) });
                return { blob, filename: result.filename || `${this._workbookName}.${format}` };
            }
        }

        // ========================================================================
        // Global State and DOM Elements
        // ========================================================================

        const canvas = document.getElementById('grid');
        const loading = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const sheetNameEl = document.getElementById('sheet-name');
        const dropZone = document.getElementById('drop-zone');
        const emptyState = document.getElementById('empty-state');
        const fileInput = document.getElementById('file-input');
        const cellEditor = document.getElementById('cell-editor');
        const columnHeaderEditor = document.getElementById('column-header-editor');
        const formulaBar = document.getElementById('formula-bar');
        const cellReference = document.getElementById('cell-reference');
        const formulaInput = document.getElementById('formula-input');

        // Initialize renderer
        const renderer = new GridRenderer(canvas);

        let dataSource = null;
        let wasmClient = null;
        let hasFileLoaded = false;

        // State
        let sheetInfo = null;
        let cells = [];
        let columns = [];
        let rows = [];
        let scrollX = 0;
        let scrollY = 0;
        let selectedCell = null;
        let selectedColumn = null;
        let selectedRow = null;

        // Editing state
        let isEditing = false;

        // Column header editing state
        let isEditingColumnHeader = false;
        let editingColumnIndex = -1;

        // Column names cache (maps column position to custom name)
        let colNames = new Map();

        // Column resize state
        let isResizing = false;
        let resizeColIndex = -1;
        let resizeStartX = 0;
        let resizeStartWidth = 0;
        let resizePreviewX = 0;
        const RESIZE_HANDLE_WIDTH = 6;

        // Row resize state
        let isResizingRow = false;
        let resizeRowIndex = -1;
        let resizeStartY = 0;
        let resizeStartHeight = 0;
        let resizePreviewY = 0;

        // Drag state
        let isDraggingColumn = false;
        let isDraggingRow = false;
        let dragSourceIndex = -1;
        let dragTargetIndex = -1;
        let dragMouseX = 0;
        let dragMouseY = 0;

        // Pending drag state (before threshold is exceeded)
        let pendingDragColumn = false;
        let pendingDragRow = false;
        let pendingDragStartX = 0;
        let pendingDragStartY = 0;
        const DRAG_THRESHOLD = 5; // Minimum pixels to move before starting drag

        // Size caches
        let colWidths = new Map();
        let rowHeights = new Map();

        // ========================================================================
        // Utility Functions
        // ========================================================================

        function getColAtX(x) {
            if (x < HEADER_WIDTH) return -1;
            let accX = HEADER_WIDTH - scrollX;
            let col = 0;
            while (accX < x && col < (sheetInfo?.colCount || 1000)) {
                accX += colWidths.get(col) || DEFAULT_COL_WIDTH;
                if (accX > x) return col;
                col++;
            }
            return col;
        }

        function getRowAtY(y) {
            if (y < HEADER_HEIGHT) return -1;
            let accY = HEADER_HEIGHT - scrollY;
            let row = 0;
            while (accY < y && row < (sheetInfo?.rowCount || 1000)) {
                accY += rowHeights.get(row) || DEFAULT_ROW_HEIGHT;
                if (accY > y) return row;
                row++;
            }
            return row;
        }

        function getResizeHandleCol(mouseX) {
            if (!sheetInfo) return -1;
            let x = HEADER_WIDTH - scrollX;
            for (let col = 0; col < sheetInfo.colCount; col++) {
                const colW = colWidths.get(col) || DEFAULT_COL_WIDTH;
                const rightEdge = x + colW;
                if (mouseX >= rightEdge - RESIZE_HANDLE_WIDTH && mouseX <= rightEdge + RESIZE_HANDLE_WIDTH) {
                    return col;
                }
                x = rightEdge;
            }
            return -1;
        }

        function getResizeHandleRow(mouseY) {
            if (!sheetInfo) return -1;
            let y = HEADER_HEIGHT - scrollY;
            for (let row = 0; row < sheetInfo.rowCount; row++) {
                const rowH = rowHeights.get(row) || DEFAULT_ROW_HEIGHT;
                const bottomEdge = y + rowH;
                if (mouseY >= bottomEdge - RESIZE_HANDLE_WIDTH && mouseY <= bottomEdge + RESIZE_HANDLE_WIDTH) {
                    return row;
                }
                y = bottomEdge;
            }
            return -1;
        }

        function getColumnId(colPos) {
            for (const col of columns) {
                if (col.pos === colPos) return col.id;
            }
            return null;
        }

        function getRowId(rowPos) {
            for (const row of rows) {
                if (row.pos === rowPos) return row.id;
            }
            return null;
        }

        function getDropTargetCol(mouseX) {
            if (mouseX < HEADER_WIDTH) return 0;
            let x = HEADER_WIDTH - scrollX;
            for (let col = 0; col < (sheetInfo?.colCount || 1000); col++) {
                const colW = colWidths.get(col) || DEFAULT_COL_WIDTH;
                const midX = x + colW / 2;
                if (mouseX < midX) return col;
                x += colW;
            }
            return sheetInfo?.colCount || 0;
        }

        function getDropTargetRow(mouseY) {
            if (mouseY < HEADER_HEIGHT) return 0;
            let y = HEADER_HEIGHT - scrollY;
            for (let row = 0; row < (sheetInfo?.rowCount || 1000); row++) {
                const rowH = rowHeights.get(row) || DEFAULT_ROW_HEIGHT;
                const midY = y + rowH / 2;
                if (mouseY < midY) return row;
                y += rowH;
            }
            return sheetInfo?.rowCount || 0;
        }

        function getCellAt(col, row) {
            return cells.find(c => c.col === col && c.row === row);
        }

        // Convert column index to Excel-style letter (A, B, ..., Z, AA, AB, ...)
        function colToLetter(col) {
            let s = '';
            let n = col + 1;
            while (n > 0) {
                n--;
                s = String.fromCharCode(65 + (n % 26)) + s;
                n = Math.floor(n / 26);
            }
            return s;
        }

        // Update formula bar with current selection
        function updateFormulaBar() {
            if (!selectedCell) {
                cellReference.textContent = '';
                formulaInput.value = '';
                formulaInput.placeholder = 'Select a cell to view or edit its value';
                return;
            }

            const ref = colToLetter(selectedCell.col) + (selectedCell.row + 1);
            cellReference.textContent = ref;

            const cell = getCellAt(selectedCell.col, selectedCell.row);
            if (cell) {
                // Show formula if available, otherwise show value
                formulaInput.value = cell.formula || cell.value || '';
            } else {
                formulaInput.value = '';
            }
            formulaInput.placeholder = '';
        }

        // ========================================================================
        // Rendering
        // ========================================================================

        function updateRendererState() {
            renderer.setStateRefs({
                sheetInfo,
                cells,
                columns,
                rows,
                colWidths,
                rowHeights,
                colNames,
                scrollX,
                scrollY,
                selectedCell,
                selectedColumn,
                selectedRow,
                isDraggingColumn,
                isDraggingRow,
                dragSourceIndex,
                dragTargetIndex,
                dragMouseX,
                dragMouseY,
                isResizing,
                resizePreviewX,
                isResizingRow,
                resizePreviewY,
                editingColumnIndex: isEditingColumnHeader ? editingColumnIndex : -1
            });
        }

        function render() {
            updateRendererState();
            renderer.render();
            if (isResizing || isResizingRow) {
                renderer.drawResizePreview();
            }
            if (isDraggingColumn || isDraggingRow) {
                renderer.drawDragGhost();
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            canvas.style.width = container.clientWidth + 'px';
            canvas.style.height = container.clientHeight + 'px';
            renderer.ctx.scale(dpr, dpr);
            render();
        }

        // ========================================================================
        // Data Fetching
        // ========================================================================

        async function fetchSheetInfo() {
            if (!dataSource) return;
            try {
                sheetInfo = await dataSource.getSheetInfo();
                sheetNameEl.textContent = sheetInfo.name;
            } catch (e) {
                console.error('Error fetching sheet info:', e);
                throw e;
            }
        }

        async function fetchViewport() {
            if (!sheetInfo || !dataSource) return;

            const container = document.getElementById('canvas-container');
            const viewWidth = container.clientWidth;
            const viewHeight = container.clientHeight;

            const startCol = Math.max(0, Math.floor(scrollX / DEFAULT_COL_WIDTH) - 2);
            const startRow = Math.max(0, Math.floor(scrollY / DEFAULT_ROW_HEIGHT) - 2);
            const endCol = Math.min(sheetInfo.colCount, startCol + Math.ceil(viewWidth / DEFAULT_COL_WIDTH) + 4);
            const endRow = Math.min(sheetInfo.rowCount, startRow + Math.ceil(viewHeight / DEFAULT_ROW_HEIGHT) + 4);

            try {
                const data = await dataSource.getViewport(startCol, startRow, endCol, endRow);
                cells = data.cells || [];
                columns = data.columns || [];
                rows = data.rows || [];

                // Clear caches for viewport range before repopulating from Workbook
                // This ensures moved columns don't leave stale data behind
                for (let col = startCol; col < endCol; col++) {
                    colWidths.delete(col);
                    colNames.delete(col);
                }
                for (let row = startRow; row < endRow; row++) {
                    rowHeights.delete(row);
                }

                // Repopulate from Workbook (source of truth)
                for (const col of columns) {
                    colWidths.set(col.pos, col.width || DEFAULT_COL_WIDTH);
                    if (col.name) {
                        colNames.set(col.pos, col.name);
                    }
                }
                for (const row of rows) {
                    rowHeights.set(row.pos, row.height || DEFAULT_ROW_HEIGHT);
                }
            } catch (e) {
                console.error('Error fetching viewport:', e);
            }
        }

        let fetchInFlight = false;
        let fetchPending = false;
        async function fetchViewportNow() {
            if (fetchInFlight) {
                fetchPending = true;
                return;
            }
            fetchInFlight = true;
            try {
                await fetchViewport();
                render();
            } finally {
                fetchInFlight = false;
                if (fetchPending) {
                    fetchPending = false;
                    fetchViewportNow();
                }
            }
        }

        // ========================================================================
        // Cell Editing
        // ========================================================================

        // Edit modes:
        // - 'append': Double-click - cursor at end of existing content
        // - 'replace': Single-click + type - clears content and starts fresh
        // - 'select': F2/Enter - selects all content

        async function startEditing(options = {}) {
            const { focusCellEditor = true, mode = 'select', initialChar = '' } = options;
            if (!selectedCell || isEditing || !dataSource) return;

            let cell = getCellAt(selectedCell.col, selectedCell.row);

            if (!cell) {
                try {
                    const data = await dataSource.createCell(selectedCell.col, selectedCell.row, '');
                    // Refresh sheet info and viewport to include new cell
                    await fetchSheetInfo();
                    await fetchViewport();
                    cell = getCellAt(selectedCell.col, selectedCell.row);
                    if (!cell) {
                        console.error('Cell was created but not found in viewport');
                        return;
                    }
                } catch (e) {
                    console.error('Error creating cell:', e);
                    return;
                }
            }

            isEditing = true;

            let cellX = HEADER_WIDTH - scrollX;
            for (let i = 0; i < selectedCell.col; i++) {
                cellX += colWidths.get(i) || DEFAULT_COL_WIDTH;
            }
            let cellY = HEADER_HEIGHT - scrollY;
            for (let i = 0; i < selectedCell.row; i++) {
                cellY += rowHeights.get(i) || DEFAULT_ROW_HEIGHT;
            }

            const cellWidth = colWidths.get(selectedCell.col) || DEFAULT_COL_WIDTH;
            const cellHeight = rowHeights.get(selectedCell.row) || DEFAULT_ROW_HEIGHT;

            cellEditor.style.left = cellX + 'px';
            cellEditor.style.top = cellY + 'px';
            cellEditor.style.width = cellWidth + 'px';
            cellEditor.style.height = cellHeight + 'px';
            cellEditor.style.display = 'block';

            if (mode === 'replace') {
                // Replace mode: start with the initial character (clears existing content)
                cellEditor.value = initialChar;
                if (focusCellEditor) {
                    cellEditor.focus();
                    // Place cursor at end (after the initial character)
                    cellEditor.setSelectionRange(initialChar.length, initialChar.length);
                }
            } else if (mode === 'append') {
                // Append mode: cursor at end of existing content
                cellEditor.value = cell.formula || cell.value || '';
                if (focusCellEditor) {
                    cellEditor.focus();
                    cellEditor.setSelectionRange(cellEditor.value.length, cellEditor.value.length);
                }
            } else {
                // Select mode: select all content (default for F2/Enter)
                cellEditor.value = cell.formula || cell.value || '';
                if (focusCellEditor) {
                    cellEditor.focus();
                    cellEditor.select();
                }
            }

            // Sync formula bar
            formulaInput.value = cellEditor.value;
        }

        function cancelEditing() {
            if (!isEditing) return;
            isEditing = false;
            cellEditor.style.display = 'none';
            cellEditor.value = '';
            canvas.focus();
        }

        async function confirmEditing() {
            if (!isEditing || !selectedCell || !dataSource) return;

            const cell = getCellAt(selectedCell.col, selectedCell.row);
            if (!cell) {
                cancelEditing();
                return;
            }

            const newValue = cellEditor.value;
            isEditing = false;
            cellEditor.style.display = 'none';

            try {
                if (newValue === '' || newValue.trim() === '') {
                    // Delete cell when content is completely cleared
                    await dataSource.deleteCell(cell.id);
                    // Refresh sheet info (dimensions may have changed)
                    await fetchSheetInfo();
                } else {
                    await dataSource.updateCell(cell.id, newValue);
                }
                // Always refresh viewport to get latest data from quadtree
                await fetchViewport();
                render();
                updateFormulaBar();
            } catch (e) {
                console.error('Error updating cell:', e);
            }
        }

        cellEditor.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') {
                e.preventDefault();
                cancelEditing();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                confirmEditing().then(() => {
                    if (selectedCell && sheetInfo) {
                        // Enter moves down, Shift+Enter moves up
                        if (e.shiftKey) {
                            selectedCell.row = Math.max(0, selectedCell.row - 1);
                        } else {
                            selectedCell.row = Math.min(sheetInfo.rowCount - 1, selectedCell.row + 1);
                        }
                        render();
                        updateFormulaBar();
                        fetchViewportNow();
                    }
                });
            } else if (e.key === 'Tab') {
                e.preventDefault();
                confirmEditing().then(() => {
                    if (selectedCell && sheetInfo) {
                        if (e.shiftKey) {
                            selectedCell.col = Math.max(0, selectedCell.col - 1);
                        } else {
                            selectedCell.col = Math.min(sheetInfo.colCount - 1, selectedCell.col + 1);
                        }
                        render();
                        updateFormulaBar();
                        fetchViewportNow();
                    }
                });
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                // Arrow keys during editing: check if cursor is at boundary
                const cursorPos = cellEditor.selectionStart;
                const textLen = cellEditor.value.length;
                const atStart = cursorPos === 0;
                const atEnd = cursorPos === textLen;

                // Only commit and navigate if at boundary in the direction of movement
                if ((e.key === 'ArrowLeft' && atStart) ||
                    (e.key === 'ArrowRight' && atEnd) ||
                    e.key === 'ArrowUp' ||
                    e.key === 'ArrowDown') {
                    e.preventDefault();
                    confirmEditing().then(() => {
                        if (selectedCell && sheetInfo) {
                            if (e.key === 'ArrowUp') {
                                selectedCell.row = Math.max(0, selectedCell.row - 1);
                            } else if (e.key === 'ArrowDown') {
                                selectedCell.row = Math.min(sheetInfo.rowCount - 1, selectedCell.row + 1);
                            } else if (e.key === 'ArrowLeft') {
                                selectedCell.col = Math.max(0, selectedCell.col - 1);
                            } else if (e.key === 'ArrowRight') {
                                selectedCell.col = Math.min(sheetInfo.colCount - 1, selectedCell.col + 1);
                            }
                            render();
                            updateFormulaBar();
                            fetchViewportNow();
                        }
                    });
                }
                // Otherwise, let the arrow key work normally within the text field
            }
        });

        cellEditor.addEventListener('blur', () => {
            if (isEditing) {
                confirmEditing();
            }
        });

        // Live sync: cell editor -> formula bar
        cellEditor.addEventListener('input', () => {
            if (isEditing) {
                formulaInput.value = cellEditor.value;
            }
        });

        // ========================================================================
        // Column Header Editing
        // ========================================================================

        function startEditingColumnHeader(colIndex) {
            if (isEditingColumnHeader || !dataSource) return;

            isEditingColumnHeader = true;
            editingColumnIndex = colIndex;

            // Calculate header position
            let headerX = HEADER_WIDTH - scrollX;
            for (let i = 0; i < colIndex; i++) {
                headerX += colWidths.get(i) || DEFAULT_COL_WIDTH;
            }
            const headerW = colWidths.get(colIndex) || DEFAULT_COL_WIDTH;

            // Position the editor over the column header
            columnHeaderEditor.style.left = headerX + 'px';
            columnHeaderEditor.style.top = '0px';
            columnHeaderEditor.style.width = headerW + 'px';
            columnHeaderEditor.style.height = HEADER_HEIGHT + 'px';
            columnHeaderEditor.style.display = 'block';

            // Set the current column name (custom or generate from letter)
            const currentName = colNames.get(colIndex) || '';
            columnHeaderEditor.value = currentName;
            columnHeaderEditor.placeholder = colToLetter(colIndex);
            columnHeaderEditor.focus();
            columnHeaderEditor.select();
        }

        function cancelEditingColumnHeader() {
            if (!isEditingColumnHeader) return;
            isEditingColumnHeader = false;
            editingColumnIndex = -1;
            columnHeaderEditor.style.display = 'none';
            columnHeaderEditor.value = '';
            canvas.focus();
        }

        async function confirmEditingColumnHeader() {
            if (!isEditingColumnHeader || editingColumnIndex < 0 || !dataSource) return;

            const colId = getColumnId(editingColumnIndex);
            const newName = columnHeaderEditor.value.trim();

            isEditingColumnHeader = false;
            const savedColIndex = editingColumnIndex;
            editingColumnIndex = -1;
            columnHeaderEditor.style.display = 'none';

            if (colId) {
                try {
                    await dataSource.renameColumn(colId, newName);
                    // Update local cache
                    if (newName) {
                        colNames.set(savedColIndex, newName);
                    } else {
                        colNames.delete(savedColIndex);
                    }
                    render();
                } catch (e) {
                    console.error('Error renaming column:', e);
                }
            }

            canvas.focus();
        }

        columnHeaderEditor.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') {
                e.preventDefault();
                cancelEditingColumnHeader();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                confirmEditingColumnHeader();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                confirmEditingColumnHeader();
            }
        });

        columnHeaderEditor.addEventListener('blur', () => {
            if (isEditingColumnHeader) {
                confirmEditingColumnHeader();
            }
        });

        // ========================================================================
        // Formula Bar Editing
        // ========================================================================

        let isEditingFormulaBar = false;

        async function commitFormulaBarEdit() {
            if (!selectedCell || !dataSource) return;

            // Hide cell editor if it's showing
            if (isEditing) {
                isEditing = false;
                cellEditor.style.display = 'none';
            }

            let cell = getCellAt(selectedCell.col, selectedCell.row);
            const newValue = formulaInput.value;

            try {
                if (newValue === '' || newValue.trim() === '') {
                    // Delete cell when content is completely cleared
                    if (cell) {
                        await dataSource.deleteCell(cell.id);
                        // Refresh sheet info (dimensions may have changed)
                        await fetchSheetInfo();
                    }
                    // If no cell exists and value is empty, nothing to do
                } else if (!cell) {
                    // Create cell if it doesn't exist and value is non-empty
                    const data = await dataSource.createCell(selectedCell.col, selectedCell.row, newValue);
                    // Refresh sheet info (new column/row may have been created)
                    await fetchSheetInfo();
                } else {
                    await dataSource.updateCell(cell.id, newValue);
                }
                // Always refresh viewport to get latest data from quadtree
                await fetchViewport();
                render();
                updateFormulaBar();
            } catch (e) {
                console.error('Error updating cell from formula bar:', e);
            }

            isEditingFormulaBar = false;
            canvas.focus();
        }

        function cancelFormulaBarEdit() {
            isEditingFormulaBar = false;
            // Remove any temp cell created during live preview
            const tempIdx = cells.findIndex(c => c.id === '_temp_');
            if (tempIdx !== -1) {
                cells.splice(tempIdx, 1);
            }
            // Refresh to restore original values
            fetchViewport().then(() => {
                render();
                updateFormulaBar();
            });
            canvas.focus();
        }

        formulaInput.addEventListener('focus', () => {
            isEditingFormulaBar = true;
            // Don't call startEditing here - formula bar editing is independent
            // The cell editor would create confusing dual state
        });

        formulaInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') {
                e.preventDefault();
                cancelFormulaBarEdit();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                commitFormulaBarEdit();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                commitFormulaBarEdit().then(() => {
                    if (selectedCell && sheetInfo) {
                        if (e.shiftKey) {
                            selectedCell.col = Math.max(0, selectedCell.col - 1);
                        } else {
                            selectedCell.col = Math.min(sheetInfo.colCount - 1, selectedCell.col + 1);
                        }
                        render();
                        updateFormulaBar();
                        formulaInput.focus();
                        formulaInput.select();
                    }
                });
            }
        });

        formulaInput.addEventListener('blur', () => {
            // isEditingFormulaBar is set to false by mousedown handler before blur fires
            // So this only commits when focus moves elsewhere (Tab to another element, etc.)
            if (isEditingFormulaBar && selectedCell) {
                commitFormulaBarEdit();
            }
        });

        // Live sync: update cell display while typing in formula bar
        formulaInput.addEventListener('input', () => {
            if (!isEditingFormulaBar || !selectedCell) return;

            // Update local cell data for live preview (without saving to engine)
            let cell = getCellAt(selectedCell.col, selectedCell.row);
            if (cell) {
                // Update existing cell's display value
                cell.value = formulaInput.value;
                cell.formula = formulaInput.value.startsWith('=') ? formulaInput.value : null;
            } else {
                // Create a temporary local cell for preview
                cells.push({
                    id: '_temp_',
                    col: selectedCell.col,
                    row: selectedCell.row,
                    value: formulaInput.value,
                    type: 's'
                });
            }
            render();
        });

        // ========================================================================
        // Event Handlers
        // ========================================================================

        canvas.addEventListener('wheel', (e) => {
            if (!sheetInfo) return;
            e.preventDefault();

            const maxScrollX = Math.max(0, sheetInfo.colCount * DEFAULT_COL_WIDTH - canvas.clientWidth + HEADER_WIDTH);
            const maxScrollY = Math.max(0, sheetInfo.rowCount * DEFAULT_ROW_HEIGHT - canvas.clientHeight + HEADER_HEIGHT);

            scrollX = Math.max(0, Math.min(maxScrollX, scrollX + e.deltaX));
            scrollY = Math.max(0, Math.min(maxScrollY, scrollY + e.deltaY));

            render();
            fetchViewportNow();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            if (!sheetInfo) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Column resize
            if (y < HEADER_HEIGHT && y > 0 && x > HEADER_WIDTH) {
                const resizeCol = getResizeHandleCol(x);
                if (resizeCol >= 0) {
                    isResizing = true;
                    resizeColIndex = resizeCol;
                    resizeStartX = e.clientX;
                    resizeStartWidth = colWidths.get(resizeCol) || DEFAULT_COL_WIDTH;

                    let colX = HEADER_WIDTH - scrollX;
                    for (let i = 0; i <= resizeCol; i++) {
                        colX += colWidths.get(i) || DEFAULT_COL_WIDTH;
                    }
                    resizePreviewX = colX;

                    canvas.style.cursor = 'col-resize';
                    e.preventDefault();
                    return;
                }
            }

            // Column header click (select, pending drag)
            if (y < HEADER_HEIGHT && y > 0 && x > HEADER_WIDTH) {
                const col = getColAtX(x);
                if (col >= 0) {
                    selectedCell = null;
                    selectedRow = null;
                    selectedColumn = col;

                    // Start pending drag (actual drag starts after threshold)
                    pendingDragColumn = true;
                    pendingDragStartX = x;
                    pendingDragStartY = y;
                    dragSourceIndex = col;
                    dragTargetIndex = col;

                    render();
                    e.preventDefault();
                    return;
                }
            }

            // Row resize
            if (x < HEADER_WIDTH && x > 0 && y > HEADER_HEIGHT) {
                const resizeRow = getResizeHandleRow(y);
                if (resizeRow >= 0) {
                    isResizingRow = true;
                    resizeRowIndex = resizeRow;
                    resizeStartY = e.clientY;
                    resizeStartHeight = rowHeights.get(resizeRow) || DEFAULT_ROW_HEIGHT;

                    let rowY = HEADER_HEIGHT - scrollY;
                    for (let i = 0; i <= resizeRow; i++) {
                        rowY += rowHeights.get(i) || DEFAULT_ROW_HEIGHT;
                    }
                    resizePreviewY = rowY;

                    canvas.style.cursor = 'row-resize';
                    e.preventDefault();
                    return;
                }
            }

            // Row header click (select, pending drag)
            if (x < HEADER_WIDTH && x > 0 && y > HEADER_HEIGHT) {
                const row = getRowAtY(y);
                if (row >= 0) {
                    selectedCell = null;
                    selectedColumn = null;
                    selectedRow = row;

                    // Start pending drag (actual drag starts after threshold)
                    pendingDragRow = true;
                    pendingDragStartX = x;
                    pendingDragStartY = y;
                    dragSourceIndex = row;
                    dragTargetIndex = row;

                    render();
                    e.preventDefault();
                    return;
                }
            }

            // Cell selection
            if (x > HEADER_WIDTH && y > HEADER_HEIGHT) {
                selectedColumn = null;
                selectedRow = null;

                const col = getColAtX(x);
                const row = getRowAtY(y);

                if (col >= 0 && row >= 0) {
                    // If editing cell editor, commit first then select new cell
                    if (isEditing) {
                        confirmEditing().then(() => {
                            selectedCell = { col, row };
                            render();
                            updateFormulaBar();
                            canvas.focus();
                        });
                    } else if (isEditingFormulaBar) {
                        // Mark as not editing BEFORE commit to prevent blur handler double-commit
                        isEditingFormulaBar = false;
                        commitFormulaBarEdit().then(() => {
                            selectedCell = { col, row };
                            render();
                            updateFormulaBar();
                            canvas.focus();
                        });
                    } else {
                        selectedCell = { col, row };
                        render();
                        updateFormulaBar();
                        canvas.focus();
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!sheetInfo) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if pending drag should become actual drag (threshold exceeded)
            if (pendingDragColumn) {
                const dx = Math.abs(x - pendingDragStartX);
                const dy = Math.abs(y - pendingDragStartY);
                if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
                    // Threshold exceeded - start actual drag
                    pendingDragColumn = false;
                    isDraggingColumn = true;
                    dragMouseX = x;
                    dragMouseY = y;
                    canvas.style.cursor = 'grabbing';
                }
            }

            if (pendingDragRow) {
                const dx = Math.abs(x - pendingDragStartX);
                const dy = Math.abs(y - pendingDragStartY);
                if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
                    // Threshold exceeded - start actual drag
                    pendingDragRow = false;
                    isDraggingRow = true;
                    dragMouseX = x;
                    dragMouseY = y;
                    canvas.style.cursor = 'grabbing';
                }
            }

            if (isResizing) {
                const delta = e.clientX - resizeStartX;
                const newWidth = Math.max(20, Math.min(1000, resizeStartWidth + delta));

                let colX = HEADER_WIDTH - scrollX;
                for (let i = 0; i < resizeColIndex; i++) {
                    colX += colWidths.get(i) || DEFAULT_COL_WIDTH;
                }
                resizePreviewX = colX + newWidth;

                render();
            } else if (isResizingRow) {
                const delta = e.clientY - resizeStartY;
                const newHeight = Math.max(16, Math.min(500, resizeStartHeight + delta));

                let rowY = HEADER_HEIGHT - scrollY;
                for (let i = 0; i < resizeRowIndex; i++) {
                    rowY += rowHeights.get(i) || DEFAULT_ROW_HEIGHT;
                }
                resizePreviewY = rowY + newHeight;

                render();
            } else if (isDraggingColumn) {
                dragTargetIndex = getDropTargetCol(x);
                dragMouseX = x;
                dragMouseY = y;

                canvas.style.cursor = 'grabbing';
                render();
            } else if (isDraggingRow) {
                dragTargetIndex = getDropTargetRow(y);
                dragMouseX = x;
                dragMouseY = y;

                canvas.style.cursor = 'grabbing';
                render();
            } else {
                // Resize cursor
                if (y < HEADER_HEIGHT && y > 0 && x > HEADER_WIDTH) {
                    const resizeCol = getResizeHandleCol(x);
                    canvas.style.cursor = resizeCol >= 0 ? 'col-resize' : 'default';
                } else if (x < HEADER_WIDTH && x > 0 && y > HEADER_HEIGHT) {
                    const resizeRow = getResizeHandleRow(y);
                    canvas.style.cursor = resizeRow >= 0 ? 'row-resize' : 'default';
                } else {
                    canvas.style.cursor = 'default';
                }
            }
        });

        canvas.addEventListener('mouseup', async (e) => {
            // Clear pending drag states (click without drag)
            if (pendingDragColumn) {
                pendingDragColumn = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                // Keep selectedColumn - column stays selected after click
            }
            if (pendingDragRow) {
                pendingDragRow = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                // Keep selectedRow - row stays selected after click
            }

            if (isResizing && dataSource) {
                const delta = e.clientX - resizeStartX;
                const newWidth = Math.max(20, Math.min(1000, resizeStartWidth + delta));

                // Optimistic update for smooth UX
                colWidths.set(resizeColIndex, newWidth);

                const colId = getColumnId(resizeColIndex);
                try {
                    if (colId) {
                        await dataSource.resizeColumn(colId, newWidth);
                    } else {
                        // Column doesn't exist - create it to store non-default size
                        await dataSource.resizeColumnByPos(resizeColIndex, newWidth);
                    }
                    // Refresh from Workbook (source of truth)
                    await fetchViewport();
                } catch (err) {
                    console.error('Error resizing column:', err);
                }

                isResizing = false;
                resizeColIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isResizingRow && dataSource) {
                const delta = e.clientY - resizeStartY;
                const newHeight = Math.max(16, Math.min(500, resizeStartHeight + delta));

                // Optimistic update for smooth UX
                rowHeights.set(resizeRowIndex, newHeight);

                const rowId = getRowId(resizeRowIndex);
                try {
                    if (rowId) {
                        await dataSource.resizeRow(rowId, newHeight);
                    } else {
                        // Row doesn't exist - create it to store non-default size
                        await dataSource.resizeRowByPos(resizeRowIndex, newHeight);
                    }
                    // Refresh from Workbook (source of truth)
                    await fetchViewport();
                } catch (err) {
                    console.error('Error resizing row:', err);
                }

                isResizingRow = false;
                resizeRowIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isDraggingColumn && dataSource) {
                if (dragSourceIndex !== dragTargetIndex && dragSourceIndex !== dragTargetIndex - 1) {
                    const colId = getColumnId(dragSourceIndex);
                    try {
                        if (colId) {
                            // Column exists - move it
                            await dataSource.moveColumn(colId, dragTargetIndex);
                        } else {
                            // Empty column - just shift other columns' positions
                            await dataSource.shiftColumnsForEmptyMove(dragSourceIndex, dragTargetIndex);
                        }
                        // Update selected column to its new position
                        if (dragTargetIndex > dragSourceIndex) {
                            selectedColumn = dragTargetIndex - 1;
                        } else {
                            selectedColumn = dragTargetIndex;
                        }
                        await fetchSheetInfo();
                        await fetchViewport();
                    } catch (err) {
                        console.error('Error moving column:', err);
                    }
                }

                isDraggingColumn = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isDraggingRow && dataSource) {
                if (dragSourceIndex !== dragTargetIndex && dragSourceIndex !== dragTargetIndex - 1) {
                    const rowId = getRowId(dragSourceIndex);
                    try {
                        if (rowId) {
                            // Row exists - move it
                            await dataSource.moveRow(rowId, dragTargetIndex);
                        } else {
                            // Empty row - just shift other rows' positions
                            await dataSource.shiftRowsForEmptyMove(dragSourceIndex, dragTargetIndex);
                        }
                        // Update selected row to its new position
                        if (dragTargetIndex > dragSourceIndex) {
                            selectedRow = dragTargetIndex - 1;
                        } else {
                            selectedRow = dragTargetIndex;
                        }
                        await fetchSheetInfo();
                        await fetchViewport();
                    } catch (err) {
                        console.error('Error moving row:', err);
                    }
                }

                isDraggingRow = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                canvas.style.cursor = 'default';
                render();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            // Clear pending drag states
            pendingDragColumn = false;
            pendingDragRow = false;

            if (isResizing) {
                isResizing = false;
                resizeColIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isResizingRow) {
                isResizingRow = false;
                resizeRowIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isDraggingColumn) {
                isDraggingColumn = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                canvas.style.cursor = 'default';
                render();
            } else if (isDraggingRow) {
                isDraggingRow = false;
                dragSourceIndex = -1;
                dragTargetIndex = -1;
                canvas.style.cursor = 'default';
                render();
            }
        });

        canvas.addEventListener('dblclick', (e) => {
            if (!sheetInfo) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Double-click on column header: start column renaming
            if (y < HEADER_HEIGHT && y > 0 && x > HEADER_WIDTH) {
                const col = getColAtX(x);
                if (col >= 0) {
                    startEditingColumnHeader(col);
                    e.preventDefault();
                    return;
                }
            }

            // Double-click on cell: start cell editing
            if (x > HEADER_WIDTH && y > HEADER_HEIGHT) {
                const col = getColAtX(x);
                const row = getRowAtY(y);

                if (col >= 0 && row >= 0) {
                    selectedCell = { col, row };
                    render();
                    updateFormulaBar();
                    // Double-click enters append mode (cursor at end of content)
                    startEditing({ mode: 'append' });
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (isEditing || isEditingFormulaBar || isEditingColumnHeader) return;
            if (!selectedCell || !sheetInfo) return;

            let newCol = selectedCell.col;
            let newRow = selectedCell.row;
            let handled = false;

            switch (e.key) {
                case 'ArrowUp':
                    newRow = Math.max(0, selectedCell.row - 1);
                    handled = true;
                    break;
                case 'ArrowDown':
                    newRow = Math.min(sheetInfo.rowCount - 1, selectedCell.row + 1);
                    handled = true;
                    break;
                case 'ArrowLeft':
                    newCol = Math.max(0, selectedCell.col - 1);
                    handled = true;
                    break;
                case 'ArrowRight':
                    newCol = Math.min(sheetInfo.colCount - 1, selectedCell.col + 1);
                    handled = true;
                    break;
                case 'Tab':
                    e.preventDefault();
                    if (e.shiftKey) {
                        newCol = Math.max(0, selectedCell.col - 1);
                    } else {
                        newCol = Math.min(sheetInfo.colCount - 1, selectedCell.col + 1);
                    }
                    handled = true;
                    break;
                case 'F2':
                    // F2 enters edit mode
                    e.preventDefault();
                    startEditing({ mode: 'select' });
                    return;
                case 'Enter':
                    // Enter just moves down (Shift+Enter moves up) - no edit mode
                    e.preventDefault();
                    if (e.shiftKey) {
                        newRow = Math.max(0, selectedCell.row - 1);
                    } else {
                        newRow = Math.min(sheetInfo.rowCount - 1, selectedCell.row + 1);
                    }
                    handled = true;
                    break;
                case 'Delete':
                case 'Backspace':
                    // Delete/Backspace clears the cell and starts editing empty
                    e.preventDefault();
                    startEditing({ mode: 'replace', initialChar: '' });
                    return;
                case 'Escape':
                    // Escape deselects
                    return;
                default:
                    // Check for printable character - start replace mode
                    // Single printable character (not control keys, not with Ctrl/Meta)
                    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        startEditing({ mode: 'replace', initialChar: e.key });
                        return;
                    }
                    return;
            }

            if (handled) {
                e.preventDefault();
            }

            selectedCell = { col: newCol, row: newRow };

            // Scroll to keep selection visible
            let selX = HEADER_WIDTH;
            for (let i = 0; i < newCol; i++) {
                selX += colWidths.get(i) || DEFAULT_COL_WIDTH;
            }
            let selY = HEADER_HEIGHT;
            for (let i = 0; i < newRow; i++) {
                selY += rowHeights.get(i) || DEFAULT_ROW_HEIGHT;
            }
            const selW = colWidths.get(newCol) || DEFAULT_COL_WIDTH;
            const selH = rowHeights.get(newRow) || DEFAULT_ROW_HEIGHT;

            const viewWidth = canvas.clientWidth;
            const viewHeight = canvas.clientHeight;

            if (selX - scrollX < HEADER_WIDTH) {
                scrollX = selX - HEADER_WIDTH;
            } else if (selX + selW - scrollX > viewWidth) {
                scrollX = selX + selW - viewWidth;
            }

            if (selY - scrollY < HEADER_HEIGHT) {
                scrollY = selY - HEADER_HEIGHT;
            } else if (selY + selH - scrollY > viewHeight) {
                scrollY = selY + selH - viewHeight;
            }

            render();
            updateFormulaBar();
            fetchViewportNow();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            fetchViewportNow();
        });

        // ========================================================================
        // File Loading
        // ========================================================================

        async function ensureWasmClient() {
            if (wasmClient) return wasmClient;

            wasmClient = new CellsClient('./worker.js');
            await wasmClient.ready;
            return wasmClient;
        }

        async function loadFile(file) {
            loading.textContent = '';
            loading.innerHTML = '<span class="spinner"></span>Loading ' + file.name + '...';
            loading.style.display = 'block';
            errorEl.style.display = 'none';
            emptyState.classList.add('hidden');

            try {
                const data = await file.arrayBuffer();
                const format = detectFormat(file.name, data);
                const baseName = getBaseName(file.name);

                const client = await ensureWasmClient();

                if (format === 'cells') {
                    const text = new TextDecoder().decode(data);
                    await client.loadCells(text);
                } else if (format === 'csv') {
                    await client.loadCSV(data);
                } else if (format === 'xlsx') {
                    await client.loadXLSX(data);
                }

                dataSource = new WasmDataSource(client);
                dataSource.setWorkbookName(baseName);
                hasFileLoaded = true;

                // Reset state
                scrollX = 0;
                scrollY = 0;
                selectedCell = null;
                selectedColumn = null;
                selectedRow = null;
                colWidths.clear();
                rowHeights.clear();
                colNames.clear();

                // Enable export button
                document.getElementById('export-btn').disabled = false;

                // Show the canvas and formula bar, resize
                canvas.style.display = 'block';
                formulaBar.classList.remove('hidden');
                resizeCanvas();

                await fetchSheetInfo();
                await fetchViewport();
                render();
                updateFormulaBar();
                loading.style.display = 'none';

            } catch (e) {
                console.error('Error loading file:', e);
                loading.style.display = 'none';
                errorEl.textContent = 'Failed to load: ' + e.message;
                errorEl.style.display = 'block';
            }
        }

        // Make functions available globally
        window.openFile = function() {
            fileInput.click();
        };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadFile(file);
                fileInput.value = '';
            }
        });

        window.exportAs = async function(format) {
            if (!dataSource) {
                alert('No file loaded');
                return;
            }
            try {
                const result = await dataSource.exportAs(format);
                downloadBlob(result.blob, result.filename);
            } catch (e) {
                console.error('Export error:', e);
                alert('Export failed: ' + e.message);
            }
        };

        // ========================================================================
        // Drag and Drop
        // ========================================================================

        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('visible');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('visible');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('visible');

            const file = e.dataTransfer.files[0];
            if (file) {
                loadFile(file);
            }
        });

        // ========================================================================
        // Export Dropdown
        // ========================================================================

        const exportDropdown = document.getElementById('export-dropdown');
        const exportBtn = document.getElementById('export-btn');

        exportBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (exportBtn.disabled) return;
            exportDropdown.classList.toggle('open');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!exportDropdown.contains(e.target)) {
                exportDropdown.classList.remove('open');
            }
        });

        // Close dropdown when clicking a menu item
        exportDropdown.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                exportDropdown.classList.remove('open');
            });
        });

        // ========================================================================
        // Initialization
        // ========================================================================

        function init() {
            resizeCanvas();
            // Show empty state initially
            emptyState.classList.remove('hidden');
            canvas.style.display = 'none';
        }

        init();
    </script>
</body>
