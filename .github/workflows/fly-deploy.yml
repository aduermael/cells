# Deploy the collaboration server (Go + static WASM) to Fly.io.
# Manual only. Also callable from deploy-all.yml (workflow_call).
#
# GitHub Environment: production
#   Secrets:
#     FLY_API_TOKEN — flyctl deploy token (required)
# Agents use the CLI externally; the Fly app only needs collab (no in-product AI).
#
# Release workflow also deploys Fly (same composite action) under a single
# production approval together with the Homebrew tap update.

name: Deploy server (Fly.io)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build and deploy to Fly.io
        uses: ./.github/actions/deploy-fly
        with:
          fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          bazel_disk_cache_key: ${{ github.workflow }}-wasm
