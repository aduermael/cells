# Build and deploy the static landing site to GitHub Pages.
# Manual only. Also callable from deploy-all.yml (workflow_call).
#
# Repo setting (one-time): Settings → Pages → Source: GitHub Actions
# No extra GitHub secrets required (uses GITHUB_TOKEN + pages permissions).

name: Deploy website (GitHub Pages)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build:
    name: Assemble pages
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Assemble static site
        run: ./tools/prepare-pages.sh dist/pages
        env:
          APP_URL: https://cells-app.fly.dev
          REPO_URL: https://github.com/${{ github.repository }}

      # actions/configure-pages@v5.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      # actions/upload-pages-artifact@v3.0.1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist/pages

  deploy:
    name: Deploy pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
